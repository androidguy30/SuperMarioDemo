<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; }
        #unity-container { width: {{{ WIDTH }}}px; height: {{{ HEIGHT }}}px; position: relative; }
        #unity-canvas { width: 100%; height: 100%; background: #000; }
        #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
        #unity-progress-bar-empty { width: 300px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        #unity-progress-bar-full { width: 0%; height: 100%; background: linear-gradient(90deg, #e63946, #f4a261); transition: width 0.3s; }
        .loading-title { color: #e63946; font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        #unity-footer { margin-top: 8px; display: flex; justify-content: space-between; width: {{{ WIDTH }}}px; }
        #unity-footer span { color: #666; font-size: 11px; }
        #unity-fullscreen-button { background: #444; border: none; color: #ccc; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div class="loading-title">{{{ PRODUCT_NAME }}}</div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>
    <div id="unity-footer">
        <span>Unity WebGL | {{{ PRODUCT_NAME }}}</span>
        <button id="unity-fullscreen-button">Fullscreen</button>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");

        createUnityInstance(canvas, {
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}",
        }, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
            };
        }).catch((message) => {
            alert(message);
        });
    </script>
</body>
</html>
